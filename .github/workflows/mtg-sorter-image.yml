# Builds the MTG scanner's Docker image and publishes it as ghcr.io/outmyfocus/mtg-sorter
# whenever mtg-sorter/ changes on main. Pull requests only build it, to catch a broken image.
# The tests run first: an image is only published when they pass, because the Pi installs a
# new :latest within 5 minutes and its rollback only checks that the app answers.
# Two platforms in one tag: amd64 for the server (tower) and arm64 for the sorter's Pi, so
# both run exactly the same version of the app (see mtg-sorter/deploy/PI_DOCKER.md).
# The package must be set to public once (GitHub > Packages > mtg-sorter > Package settings)
# so a server can pull it without logging in.
name: mtg-sorter image

on:
  push:
    branches: [main]
    paths: ["mtg-sorter/**", ".github/workflows/mtg-sorter-image.yml"]
  pull_request:
    paths: ["mtg-sorter/**", ".github/workflows/mtg-sorter-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mtg-sorter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mtg-sorter/requirements.txt

      # The same packages as the image (headless OpenCV, see the Dockerfile).
      - name: Install packages
        run: |
          sed -i 's/^opencv-python>/opencv-python-headless>/' requirements.txt
          pip install -r requirements.txt

      - name: Run the tests
        env:
          MTG_DATA_DIR: ${{ runner.temp }}/data
        run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the Pi's arm64 image on GitHub's x86 machines.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub's registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish, on main)
        uses: docker/build-push-action@v6
        with:
          context: mtg-sorter
          platforms: linux/amd64,linux/arm64
          build-args: MTG_VERSION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/outmyfocus/mtg-sorter:latest
            ghcr.io/outmyfocus/mtg-sorter:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
