# Runs the MTG scanner's tests on every pull request and on main, so a PR that breaks
# something shows a red check before it's merged. (The image workflow only checks that
# the Docker image builds.)
name: mtg-sorter tests

on:
  push:
    branches: [main]
    paths: ["mtg-sorter/**", ".github/workflows/mtg-sorter-tests.yml"]
  pull_request:
    paths: ["mtg-sorter/**", ".github/workflows/mtg-sorter-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mtg-sorter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mtg-sorter/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q
