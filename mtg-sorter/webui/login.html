<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <meta name="theme-color" content="#0e1013">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SortR">
  <meta name="color-scheme" content="dark light">
  <title>SortR · Log in</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/collection.css">
  <link rel="stylesheet" href="/static/extras.css">
  <link rel="stylesheet" href="/static/accounts.css">
  <script src="/static/look.js"></script>
</head>
<body class="lock-body auth">
  <div class="auth-bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <form class="panel lock-box login-box" id="form">
    <div class="auth-brand" aria-hidden="true"><span class="logo-tile big"><svg class="logo" viewBox="0 0 24 24">
      <rect x="3.6" y="4.2" width="9" height="13" rx="1.9" transform="rotate(-14 8.1 10.7)" fill="currentColor" opacity=".38" />
      <rect x="6.2" y="4.6" width="9" height="13" rx="1.9" transform="rotate(-4 10.7 11.1)" fill="currentColor" opacity=".62" />
      <rect x="9.2" y="5.4" width="9.4" height="13.6" rx="1.9" transform="rotate(8 13.9 12.2)" fill="currentColor" />
      <path d="M13.9 8.6c.4 2 1.1 2.8 3.1 3.2-2 .4-2.7 1.2-3.1 3.2-.4-2-1.1-2.8-3.1-3.2 2-.4 2.7-1.2 3.1-3.2Z" transform="rotate(8 13.9 12.2)" fill="var(--logo-spark)" />
    </svg></span><span class="wordmark">Sort<b>R</b></span></div>
    <h2 id="title">Log in to SortR</h2>
    <p class="sub" id="sub">Your cards, decks and wishlist are your own.</p>
    <div id="fields" class="login-fields">
      <label>Username<input class="field" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label>Password<input class="field" id="password" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary">Log in</button>
    </div>
    <div id="denied" class="login-fields" hidden>
      <a class="btn primary" href="/">Go to Home</a>
      <button type="button" class="btn ghost" id="switch">Log in as someone else</button>
    </div>
    <p class="err" id="err" hidden></p>
    <p class="sub small">No account yet, or forgot your password? Ask whoever runs this sorter.</p>
  </form>
  <script>
    (() => {
      const $ = id => document.getElementById(id), err = $("err");
      const next = new URLSearchParams(location.search).get("next");
      const safeNext = next && next.startsWith("/") && !next.startsWith("//") && !next.startsWith("/login") ? next : "/";
      const go = () => location.replace(location.pathname === "/login" ? safeNext : location.href);
      const show = msg => { err.textContent = msg; err.hidden = false; };
      // Opened on a page this account can't use (the app answers with this page and a 403).
      const denied = location.pathname !== "/login";
      fetch("/api/me").then(r => r.json()).then(s => {
        if (!s.accounts) return go();   // accounts are off: nothing to log in to
        if (s.me && !denied) return go();
        if (s.me && denied) {
          $("title").textContent = "Your account can't open this page";
          $("sub").textContent = `You're logged in as ${s.me.name}. Ask an admin for the permission if you need it.`;
          $("fields").hidden = true; $("denied").hidden = false;
        }
      }).catch(() => {});
      $("switch").onclick = async () => {
        await fetch("/api/logout", { method: "POST" });
        location.href = "/login?next=" + encodeURIComponent(location.pathname + location.search);
      };
      $("form").onsubmit = async e => {
        e.preventDefault(); err.hidden = true;
        const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: $("username").value.trim(), password: $("password").value }) });
        if (r.ok) return go();
        const js = await r.json().catch(() => ({}));
        show(js.error || "That didn't work"); $("password").value = ""; $("password").focus();
      };
    })();
  </script>
</body>
</html>
