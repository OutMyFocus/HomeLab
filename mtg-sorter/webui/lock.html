<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <meta name="theme-color" content="#0e1013">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SortR">
  <meta name="color-scheme" content="dark light">
  <title>SortR · Locked</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/extras.css">
  <script src="/static/look.js"></script>
</head>
<body class="lock-body auth">
  <div class="auth-bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <form class="panel lock-box" id="form" autocomplete="off">
    <div class="auth-brand" aria-hidden="true"><span class="logo-tile big"><svg class="logo" viewBox="0 0 24 24">
      <rect x="3.6" y="4.2" width="9" height="13" rx="1.9" transform="rotate(-14 8.1 10.7)" fill="currentColor" opacity=".38" />
      <rect x="6.2" y="4.6" width="9" height="13" rx="1.9" transform="rotate(-4 10.7 11.1)" fill="currentColor" opacity=".62" />
      <rect x="9.2" y="5.4" width="9.4" height="13.6" rx="1.9" transform="rotate(8 13.9 12.2)" fill="currentColor" />
      <path d="M13.9 8.6c.4 2 1.1 2.8 3.1 3.2-2 .4-2.7 1.2-3.1 3.2-.4-2-1.1-2.8-3.1-3.2 2-.4 2.7-1.2 3.1-3.2Z" transform="rotate(8 13.9 12.2)" fill="var(--logo-spark)" />
    </svg></span><span class="wordmark">Sort<b>R</b></span></div>
    <h2>SortR is locked</h2>
    <p class="sub">Type the PIN to open it on this device.</p>
    <input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" aria-label="PIN" autofocus>
    <div class="keypad" id="keypad">
      <button type="button">1</button><button type="button">2</button><button type="button">3</button>
      <button type="button">4</button><button type="button">5</button><button type="button">6</button>
      <button type="button">7</button><button type="button">8</button><button type="button">9</button>
      <button type="button" data-k="clear">Clear</button><button type="button">0</button><button type="submit" class="go">Open</button>
    </div>
    <p class="err" id="err" hidden></p>
    <p class="sub small">Forgot it? On the Pi, delete <code>data/pin.json</code>.</p>
  </form>
  <script>
    (() => {
      const pin = document.getElementById("pin"), err = document.getElementById("err");
      const next = new URLSearchParams(location.search).get("next");
      const go = () => location.replace(next && next.startsWith("/") && !next.startsWith("//") ? next : (location.pathname === "/lock" ? "/" : location.href));
      fetch("/api/lock").then(r => r.json()).then(s => {
        if (s.accounts) return location.replace("/login" + location.search);   // accounts are on: log in instead
        if (s.unlocked) go();
      }).catch(() => {});
      document.getElementById("keypad").onclick = e => {
        const b = e.target.closest("button"); if (!b || b.type === "submit") return;
        if (b.dataset.k === "clear") pin.value = ""; else if (pin.value.length < 8) pin.value += b.textContent;
        pin.focus();
      };
      document.getElementById("form").onsubmit = async e => {
        e.preventDefault(); err.hidden = true;
        const r = await fetch("/api/unlock", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: pin.value }) });
        if (r.ok) return go();
        const js = await r.json().catch(() => ({}));
        err.textContent = js.error || "That didn't work"; err.hidden = false; pin.value = ""; pin.focus();
      };
    })();
  </script>
</body>
</html>
