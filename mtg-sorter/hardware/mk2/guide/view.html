<body><script type="module">
import * as THREE from 'three';

const sc = await (await fetch('/guide/w/scene.json?' + Math.random())).json();

const loader = new STLLoader();

    const g = new THREE.Group();
    const sh = new THREE.Mesh(new THREE.CylinderGeometry(w / 2, w / 2, L - hl, 16), mat); sh.position.y = (L - hl) / 2; g.add(sh);
    const hd = new THREE.Mesh(new THREE.ConeGeometry(w * 1.3, hl, 20), mat); hd.position.y = L - hl / 2; g.add(hd);
